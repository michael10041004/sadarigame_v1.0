      // =========================================================================
      // utils/audio.ts
      // =========================================================================
      let audioCtx = null;

      function getAudioContext() {
        if (typeof window === 'undefined') return null;
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      }

      const soundManager = {
        muted: false,

        toggleMute() {
          this.muted = !this.muted;
          return this.muted;
        },

        playStep() {
          if (this.muted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(320, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.04, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.04);
          } catch {}
        },

        playTurn() {
          if (this.muted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.07);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.07);
          } catch {}
        },

        playArrival() {
          if (this.muted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const freqs = [523.25, 659.25, 783.99];
            freqs.forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.05);
              gain.gain.setValueAtTime(0.09, ctx.currentTime + idx * 0.05);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.05 + 0.4);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + idx * 0.05);
              osc.stop(ctx.currentTime + idx * 0.05 + 0.45);
            });
          } catch {}
        },

        playBalloonInflate() {
          if (this.muted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.8);

            gain.gain.setValueAtTime(0.01, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.85);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.85);
          } catch {}
        },

        playSpecialFanfare() {
          if (this.muted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const notes = [
              { f: 523.25, t: 0.0, d: 0.15 },
              { f: 659.25, t: 0.14, d: 0.15 },
              { f: 783.99, t: 0.28, d: 0.2 },
              { f: 1046.5, t: 0.46, d: 0.9 },
            ];

            notes.forEach((note) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(note.f, ctx.currentTime + note.t);

              gain.gain.setValueAtTime(0.15, ctx.currentTime + note.t);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + note.t + note.d);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(ctx.currentTime + note.t);
              osc.stop(ctx.currentTime + note.t + note.d);
            });
          } catch {}
        },

        playPop() {
          if (this.muted) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;
            const bufferSize = ctx.sampleRate * 0.08;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = Math.random() * 2 - 1;
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1200, ctx.currentTime);
            filter.Q.setValueAtTime(3, ctx.currentTime);

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.07);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);

            noise.start();
            noise.stop(ctx.currentTime + 0.08);

            const osc = ctx.createOscillator();
            const oscGain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(140, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.08);
            oscGain.gain.setValueAtTime(0.2, ctx.currentTime);
            oscGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

            osc.connect(oscGain);
            oscGain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
          } catch {}
        },
      };

      // utils/confetti.ts
      // =========================================================================
      const CELEBRATION_COLORS = [
        '#F59E0B', '#EF4444', '#EC4899', '#8B5CF6',
        '#3B82F6', '#10B981', '#F97316', '#FBBF24',
        '#06B6D4', '#A855F7', '#FFD700'
      ];

      function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = (Math.PI / 2) * 3;
        let x = cx;
        let y = cy;
        const step = Math.PI / spikes;

        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          ctx.lineTo(x, y);
          rot += step;

          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
      }

      function launchConfetti(canvas, options) {
        const ctx = canvas.getContext('2d');
        if (!ctx) return () => {};
        const context = ctx;

        const count = options?.count ?? 150;
        const width = (canvas.width = window.innerWidth);
        const height = (canvas.height = window.innerHeight);

        const originX = (options?.originX ?? 0.5) * width;
        const originY = (options?.originY ?? 0.4) * height;
        const spread = options?.spread ?? 1;

        const particles = [];
        const shapes = ['rect', 'circle', 'ribbon', 'star'];

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (Math.random() * 12 + 6) * spread;
          particles.push({
            x: originX + (Math.random() - 0.5) * 40,
            y: originY + (Math.random() - 0.5) * 40,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (Math.random() * 4 + 2),
            angle: Math.random() * Math.PI * 2,
            vAngle: (Math.random() - 0.5) * 0.2,
            size: Math.random() * 8 + 6,
            color: CELEBRATION_COLORS[Math.floor(Math.random() * CELEBRATION_COLORS.length)],
            shape: shapes[Math.floor(Math.random() * shapes.length)],
            alpha: 1,
            decay: Math.random() * 0.008 + 0.006,
          });
        }

        let animationFrameId;

        function render() {
          context.clearRect(0, 0, width, height);

          let active = false;

          for (const p of particles) {
            if (p.alpha <= 0.01) continue;
            active = true;

            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.22;
            p.vx *= 0.985;
            p.angle += p.vAngle;
            p.alpha = Math.max(0, p.alpha - p.decay);

            context.save();
            context.globalAlpha = p.alpha;
            context.fillStyle = p.color;
            context.translate(p.x, p.y);
            context.rotate(p.angle);

            if (p.shape === 'rect') {
              context.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
            } else if (p.shape === 'circle') {
              context.beginPath();
              context.arc(0, 0, p.size / 2, 0, Math.PI * 2);
              context.fill();
            } else if (p.shape === 'ribbon') {
              context.fillRect(-p.size, -2, p.size * 2, 4);
            } else if (p.shape === 'star') {
              drawStar(context, 0, 0, 5, p.size * 0.7, p.size * 0.35);
              context.fill();
            }

            context.restore();
          }

          if (active) {
            animationFrameId = requestAnimationFrame(render);
          } else {
            context.clearRect(0, 0, width, height);
          }
        }

        animationFrameId = requestAnimationFrame(render);

        return () => {
          cancelAnimationFrame(animationFrameId);
          context.clearRect(0, 0, width, height);
        };
      }

      // =========================================================================
      // utils/exportImage.ts
      // =========================================================================
      function drawRoundedRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      // =========================================================================
      // utils/ladderGenerator.ts
      // =========================================================================
      function generateLadderRungs(numCols, density = 'normal') {
        const rungs = [];
        const minSpacing = numCols > 12 ? 0.022 : 0.035;

        const rungsPerGap = density === 'low' ? 3 : density === 'high' ? 6 : 4;
        const numGaps = numCols - 1;
        const totalRungs = numGaps * rungsPerGap;

        const totalSlots = Math.max(totalRungs * 2, 40);
        const occupiedHeights = [];

        let attempts = 0;
        const maxAttempts = Math.max(2500, numCols * 200);

        for (let gap = 0; gap < numGaps; gap++) {
          let placedForGap = 0;
          while (placedForGap < rungsPerGap && attempts < maxAttempts) {
            attempts++;
            const slotIndex = Math.floor(Math.random() * (totalSlots - 2)) + 1;
            const y = 0.08 + (slotIndex / totalSlots) * 0.84 + (Math.random() - 0.5) * 0.015;

            const conflict = occupiedHeights.some((item) => {
              const isSameGap = item.col === gap;
              const isNeighbor = Math.abs(item.col - gap) <= 1;
              const dist = Math.abs(item.y - y);
              if (isSameGap && dist < minSpacing * 1.5) return true;
              if (isNeighbor && dist < minSpacing) return true;
              return false;
            });

            if (!conflict) {
              occupiedHeights.push({ col: gap, y });
              rungs.push({
                id: `rung-${gap}-${placedForGap}-${Math.random().toString(36).slice(2, 6)}`,
                leftCol: gap,
                rightCol: gap + 1,
                yFraction: y,
              });
              placedForGap++;
            }
          }
        }

        rungs.sort((a, b) => a.yFraction - b.yFraction);
        return rungs;
      }

      function traceParticipantPath(startCol, rungs) {
        let currentCol = startCol;
        let currentY = 0;
        const path = [{ x: currentCol, y: 0 }];

        const sortedRungs = [...rungs].sort((a, b) => a.yFraction - b.yFraction);

        for (const rung of sortedRungs) {
          if (rung.yFraction > currentY) {
            if (rung.leftCol === currentCol) {
              path.push({ x: currentCol, y: rung.yFraction });
              currentCol = rung.rightCol;
              path.push({ x: currentCol, y: rung.yFraction });
              currentY = rung.yFraction;
            } else if (rung.rightCol === currentCol) {
              path.push({ x: currentCol, y: rung.yFraction });
              currentCol = rung.leftCol;
              path.push({ x: currentCol, y: rung.yFraction });
              currentY = rung.yFraction;
            }
          }
        }

        path.push({ x: currentCol, y: 1.0 });

        return { path, endCol: currentCol };
      }

      function computeAllResults(participants, prizes, rungs) {
        return participants.map((participant, index) => {
          const { path, endCol } = traceParticipantPath(index, rungs);
          const prize = prizes[endCol] || {
            id: `fallback-${endCol}`,
            name: `경품 ${endCol + 1}`,
            isSpecial: false,
          };

          return {
            participantId: participant.id,
            participantName: participant.name,
            participantColor: participant.color,
            prizeId: prize.id,
            prizeName: prize.name,
            isSpecial: prize.isSpecial,
            endCol,
            path,
          };
        });
      }

              id: `p-${i + 1}`,
              name: trimmed,
              color: pal.color,
              bgLight: pal.bgLight,
              border: pal.border,
              textColor: pal.text,
              avatarChar: trimmed.charAt(0) || `${i + 1}`,
            };
          });

          let newPrizes = [...prizes];

                name: `경품 ${i + 1}`,

          setNewGroupName('');
          setGroupModalMode('NONE');
          showToast(`💾 '${groupName}' 그룹이 성공적으로 저장되었습니다!`);

          const updated = deleteSavedGroup(groupId);
          setSavedGroups(updated);
          if (editingGroup?.id === groupId) {

          try {
            localStorage.setItem('ladder_saved_participant_groups_v1', JSON.stringify(DEFAULT_GROUPS));
            setSavedGroups(DEFAULT_GROUPS);
            showToast('기본 추천 그룹 목록으로 복원되었습니다.');

        };

        const handleOpenEditGroup = (group) => {
          setEditingGroup(group);
          setEditName(group.name);
          setEditMembers([...group.members]);
          setAddMemberInput('');
          setIsBulkEditMode(false);
          setBulkEditText(group.members.join('\n'));

        const handleOpenCreateNewGroup = () => {
          const blankGroup = {
            id: `new-${Date.now()}`,
            name: `새 그룹 (${DEFAULT_NAMES.slice(0, 6).length}명)`,
            members: DEFAULT_NAMES.slice(0, 6),
            createdAt: Date.now(),
          };

        const handleEditMemberName = (index, newName) => {
          setEditMembers((prev) => {
            const copy = [...prev];
            copy[index] = newName;
            return copy;
          });

        const handleRemoveMemberFromEdit = (index) => {
          if (editMembers.length <= MIN_PARTICIPANTS) {
            showToast(`참여자는 최소 ${MIN_PARTICIPANTS}명 이상이어야 합니다.`);

          setEditMembers((prev) => prev.filter((_, i) => i !== index));

          if (editMembers.length >= MAX_PARTICIPANTS) {
            showToast(`참여자는 최대 ${MAX_PARTICIPANTS}명까지만 가능합니다.`);

          const nextIdx = editMembers.length;
          const defaultName = DEFAULT_NAMES[nextIdx] || `참여자 ${nextIdx + 1}`;

        const handleRemoveOneMemberFromEdit = () => {
          if (editMembers.length <= MIN_PARTICIPANTS) {

            const parsed = bulkEditText
              .split(/[\n,]+/)

          if (!editingGroup) return;

          let finalMembers = isBulkEditMode

          if (finalMembers.length < MIN_PARTICIPANTS) {

          const updated = [...prizes];
          updated[index] = {
            ...updated[index],
            isSpecial: !updated[index].isSpecial,

        const handleSetCount = (newCount) => {
          if (newCount < MIN_PARTICIPANTS || newCount > MAX_PARTICIPANTS) return;

          let newParticipants = [...participants];
          let newPrizes = [...prizes];

          if (newCount > participants.length) {
            for (let i = participants.length; i < newCount; i++) {
              const pal = getPaletteForIndex(i);

                color: pal.color,
                bgLight: pal.bgLight,
                border: pal.border,
                textColor: pal.text,
                avatarChar: defaultName.charAt(0),

                id: `prize-${i + 1}`,
                name: `경품 ${i + 1}`,
                isSpecial: false,
              });

          } else if (newCount < participants.length) {

            newPrizes = newPrizes.slice(0, newCount);

          onUpdateParticipants(newParticipants);
          onUpdatePrizes(newPrizes);

        const handleApplyPreset = (presetIndex) => {
          const preset = PRESET_THEMES[presetIndex];

      // =========================================================================
      // components/LadderBoard.tsx
      // =========================================================================
      const LadderBoard = ({
        participants,
        prizes,
        rungs,
        results,
        onReshuffleRungs,
        onRevealSpecialWinner,
        onViewSummary,
      }) => {
        const numCols = participants.length;
        const [completedIds, setCompletedIds] = useState(new Set());
        const [activeParticipantId, setActiveParticipantId] = useState(null);
        const [activePoint, setActivePoint] = useState(null);
        const [isBlind, setIsBlind] = useState(false);
        const [speed, setSpeed] = useState(1.5);
        const [revealedAll, setRevealedAll] = useState(false);
        const [isAutoPlaying, setIsAutoPlaying] = useState(false);
        const [isSavingImage, setIsSavingImage] = useState(false);
        const [imageSavedSuccess, setImageSavedSuccess] = useState(false);

        const triggeredSpecialsRef = useRef(new Set());
        const animationCancelRef = useRef(null);
        const isAutoPlayingRef = useRef(false);
        const completedIdsRef = useRef(new Set());

        useEffect(() => {
          completedIdsRef.current = completedIds;
        }, [completedIds]);

        useEffect(() => {
          return () => {
            isAutoPlayingRef.current = false;
            if (animationCancelRef.current) {
              animationCancelRef.current();
            }
          };
        }, []);

        const startTrace = useCallback(
          (participantId, onComplete) => {
            const result = results.find((r) => r.participantId === participantId);
            if (!result) return;

            if (animationCancelRef.current) {
              animationCancelRef.current();
              animationCancelRef.current = null;
            }

            setActiveParticipantId(participantId);
            const path = result.path;
            if (path.length < 2) return;

            let totalDist = 0;
            const segmentDists = [];
            for (let i = 0; i < path.length - 1; i++) {
              const dx = Math.abs(path[i + 1].x - path[i].x);
              const dy = Math.abs(path[i + 1].y - path[i].y);
              const dist = dx + dy;
              segmentDists.push(dist);
              totalDist += dist;
            }

            const duration = (2000 / speed) * Math.min(1.3, Math.max(0.65, totalDist));
            let startTime = null;
            let cancelled = false;
            let lastSegmentIndex = -1;

            animationCancelRef.current = () => {
              cancelled = true;
            };

            const targetResult = result;

            function step(timestamp) {
              if (cancelled) return;
              if (!startTime) startTime = timestamp;
              const elapsed = timestamp - startTime;
              const progress = Math.min(1, elapsed / duration);

              const currentTargetDist = progress * totalDist;
              let accumulated = 0;
              let currentSeg = 0;

              while (currentSeg < segmentDists.length && accumulated + segmentDists[currentSeg] < currentTargetDist) {
                accumulated += segmentDists[currentSeg];
                currentSeg++;
              }

              if (currentSeg !== lastSegmentIndex) {
                lastSegmentIndex = currentSeg;
                if (currentSeg > 0 && path[currentSeg]) {
                  const prev = path[currentSeg - 1];
                  const curr = path[currentSeg];
                  if (prev.x !== curr.x) {
                    soundManager.playTurn();
                  } else {
                    soundManager.playStep();
                  }
                }
              }

              if (currentSeg < segmentDists.length) {
                const segProgress = (currentTargetDist - accumulated) / segmentDists[currentSeg];
                const p1 = path[currentSeg];
                const p2 = path[currentSeg + 1];
                const interpX = p1.x + (p2.x - p1.x) * segProgress;
                const interpY = p1.y + (p2.y - p1.y) * segProgress;
                setActivePoint({ x: interpX, y: interpY });
              } else {
                const last = path[path.length - 1];
                setActivePoint(last);
              }

              if (progress < 1) {
                requestAnimationFrame(step);
              } else {
                setActivePoint(null);
                setActiveParticipantId(null);
                setCompletedIds((prev) => {
                  const nextSet = new Set([...prev, participantId]);
                  completedIdsRef.current = nextSet;
                  return nextSet;
                });
                soundManager.playArrival();

                const isSpecial = targetResult.isSpecial && !triggeredSpecialsRef.current.has(participantId);
                if (isSpecial) {
                  triggeredSpecialsRef.current.add(participantId);
                  setTimeout(() => {
                    onRevealSpecialWinner(targetResult);
                  }, 350);
                }

                if (onComplete) {
                  const pauseTime = isSpecial ? 2200 : 500;
                  setTimeout(() => {
                    if (isAutoPlayingRef.current) {
                      onComplete();
                    }
                  }, pauseTime);
                }
              }
            }

            requestAnimationFrame(step);
          },
          [results, speed, onRevealSpecialWinner]
        );

        const runNextAutoStep = useCallback(() => {
          if (!isAutoPlayingRef.current) return;

          const next = participants.find((p) => !completedIdsRef.current.has(p.id));
          if (next) {
            startTrace(next.id, () => {
              runNextAutoStep();
            });
          } else {
            isAutoPlayingRef.current = false;
            setIsAutoPlaying(false);
            setRevealedAll(true);
          }
        }, [participants, startTrace]);

        const handleToggleAutoSequence = () => {
          if (isAutoPlaying) {
            isAutoPlayingRef.current = false;
            setIsAutoPlaying(false);
            if (animationCancelRef.current) {
              animationCancelRef.current();
              animationCancelRef.current = null;
            }
            setActiveParticipantId(null);
            setActivePoint(null);
          } else {
            isAutoPlayingRef.current = true;
            setIsAutoPlaying(true);
            runNextAutoStep();
          }
        };

        const handleTraceNext = () => {
          if (isAutoPlaying) {
            isAutoPlayingRef.current = false;
            setIsAutoPlaying(false);
          }
          const next = participants.find((p) => !completedIds.has(p.id));
          if (next) {
            startTrace(next.id);
          }
        };

        const handleSkipToInstant = () => {
          isAutoPlayingRef.current = false;
          setIsAutoPlaying(false);
          if (animationCancelRef.current) {
            animationCancelRef.current();
            animationCancelRef.current = null;
          }
          setActiveParticipantId(null);
          setActivePoint(null);
          setRevealedAll(true);
          const allIds = new Set(participants.map((p) => p.id));
          setCompletedIds(allIds);
          completedIdsRef.current = allIds;

          const specialResult = results.find((r) => r.isSpecial && !triggeredSpecialsRef.current.has(r.participantId));
          if (specialResult) {
            triggeredSpecialsRef.current.add(specialResult.participantId);
            setTimeout(() => {
              onRevealSpecialWinner(specialResult);
            }, 300);
          }
        };

        const handleReset = () => {
          isAutoPlayingRef.current = false;
          setIsAutoPlaying(false);
          if (animationCancelRef.current) {
            animationCancelRef.current();
            animationCancelRef.current = null;
          }
          setActiveParticipantId(null);
          setActivePoint(null);
          setCompletedIds(new Set());
          completedIdsRef.current = new Set();
          setRevealedAll(false);
          triggeredSpecialsRef.current.clear();
          onReshuffleRungs();
        };

        const handleExportJpg = async () => {
          if (isSavingImage) return;
          setIsSavingImage(true);
          setImageSavedSuccess(false);

          const success = await exportResultsToJpg(results, '윤관의 랜덤 사다리~~ 게임 최종 결과');
          setIsSavingImage(false);
          if (success) {
            setImageSavedSuccess(true);
            setTimeout(() => setImageSavedSuccess(false), 3000);
          }
        };

        const completedResults = results.filter((r) => completedIds.has(r.participantId));
        const allCompleted = completedIds.size === participants.length;
        const currentRunningParticipant = participants.find((p) => p.id === activeParticipantId);

        return (
          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 select-none">
            {/* Control Action Strip */}
            <div className="mb-4 p-3.5 bg-white border border-slate-200 rounded-2xl shadow-xs flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center flex-wrap gap-2">
                <button
                  onClick={handleToggleAutoSequence}
                  disabled={allCompleted && !isAutoPlaying}
                  className={`px-4 py-2 text-xs sm:text-sm font-bold rounded-xl transition-all shadow-xs flex items-center gap-1.5 active:scale-95 ${
                    isAutoPlaying
                      ? 'bg-amber-500 hover:bg-amber-600 text-white animate-pulse'
                      : 'bg-slate-900 hover:bg-slate-800 text-white disabled:opacity-40 disabled:pointer-events-none'
                  }`}
                >
                  {isAutoPlaying ? (
                    <>
                      <span className="w-2 h-2 rounded-full bg-white animate-ping mr-0.5" />
                      <span>순차 추첨 일시 정지</span>
                    </>
                  ) : (
                    <>
                      <FastForward className="w-3.5 h-3.5 fill-white text-white" />
                      <span>전체 결과 순차 추첨</span>
                    </>
                  )}
                </button>

                <button
                  onClick={handleTraceNext}
                  disabled={allCompleted || isAutoPlaying || activeParticipantId !== null}
                  className="px-3.5 py-2 text-xs sm:text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 rounded-xl transition-all flex items-center gap-1.5 active:scale-95"
                >
                  <Play className="w-3.5 h-3.5 text-slate-700" />
                  <span>다음 1명 추첨</span>
                </button>

                {(isAutoPlaying || (activeParticipantId && !allCompleted)) && (
                  <button
                    onClick={handleSkipToInstant}
                    className="px-3 py-1.5 text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 hover:bg-rose-100 rounded-xl transition-all flex items-center gap-1 active:scale-95"
                  >
                    <span>즉시 전체 완료 (스킵)</span>
                  </button>
                )}
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsBlind(!isBlind)}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-xl border transition-all flex items-center gap-1.5 ${
                    isBlind
                      ? 'bg-purple-100 border-purple-300 text-purple-900 font-bold'
                      : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                  }`}
                >
                  {isBlind ? <EyeOff className="w-3.5 h-3.5" /> : <Eye className="w-3.5 h-3.5" />}
                  <span>{isBlind ? '블라인드 ON' : '블라인드 OFF'}</span>
                </button>

                <div className="flex items-center bg-slate-100 rounded-xl p-0.5 border border-slate-200 text-xs">
                  {[1, 1.5, 2].map((spd) => (
                    <button
                      key={spd}
                      onClick={() => setSpeed(spd)}
                      className={`px-2 py-1 rounded-lg font-bold transition-all ${
                        speed === spd
                          ? 'bg-white text-slate-900 shadow-xs'
                          : 'text-slate-500 hover:text-slate-900'
                      }`}
                    >
                      {spd}x
                    </button>
                  ))}
                </div>

                <button
                  onClick={handleReset}
                  className="px-3 py-1.5 text-xs font-semibold rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all flex items-center gap-1"
                >
                  <RotateCcw className="w-3.5 h-3.5" />
                  <span>다시 섞기</span>
                </button>

                {allCompleted && (
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={handleExportJpg}
                      disabled={isSavingImage}
                      className="px-3.5 py-1.5 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white transition-all flex items-center gap-1.5 shadow-xs active:scale-95 disabled:opacity-50"
                    >
                      {imageSavedSuccess ? (
                        <>
                          <CheckCircle2 className="w-3.5 h-3.5 text-emerald-300" />
                          <span>JPG 저장 완료!</span>
                        </>
                      ) : isSavingImage ? (
                        <>
                          <span className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin" />
                          <span>저장 중...</span>
                        </>
                      ) : (
                        <>
                          <Download className="w-3.5 h-3.5 text-white" />
                          <span>결과 JPG 저장</span>
                        </>
                      )}
                    </button>

                    <button
                      onClick={onViewSummary}
                      className="px-3.5 py-1.5 text-xs font-bold rounded-xl bg-amber-400 text-slate-900 hover:bg-amber-300 transition-all flex items-center gap-1.5 shadow-xs animate-bounce active:scale-95"
                    >
                      <Trophy className="w-3.5 h-3.5" />
                      <span>결과표 보기</span>
                    </button>
                  </div>
                )}
              </div>
            </div>

            {isAutoPlaying && currentRunningParticipant && (
              <div className="mb-4 p-2.5 px-4 bg-gradient-to-r from-amber-500/10 via-rose-500/10 to-indigo-500/10 border border-amber-300/80 rounded-2xl flex items-center justify-between text-xs animate-pulse">
                <div className="flex items-center gap-2">
                  <span className="text-base">🎬</span>
                  <span className="font-bold text-slate-900">
                    순차 추첨 진행 중: [{currentRunningParticipant.name}] 님의 사다리를 타고 내려가는 중입니다...

                        if (activePoint) {
                          for (let i = 0; i < fullPath.length; i++) {
                            const p = fullPath[i];
                            const next = fullPath[i + 1];
                            pts.push(p);

                            if (next) {
                              const minX = Math.min(p.x, next.x);
                              const maxX = Math.max(p.x, next.x);
                              const minY = Math.min(p.y, next.y);
                              const maxY = Math.max(p.y, next.y);

                              if (
                                activePoint.x >= minX - 0.001 &&
                                activePoint.x <= maxX + 0.001 &&
                                activePoint.y >= minY - 0.001 &&
                                activePoint.y <= maxY + 0.001
                              ) {
                                pts.push(activePoint);

                  <div>
                    <h2 className="text-xl sm:text-2xl font-extrabold tracking-tight">
                      윤관의 랜덤 사다리~~ 게임 최종 결과
                    </h2>
                    <p className="text-xs sm:text-sm text-white/90">
                      총 {results.length}명의 참여자에게 경품이 성공적으로 매핑되었습니다
                    </p>
                  </div>
                </div>
                <button
                  onClick={onClose}
                  className="p-2 rounded-xl text-white/80 hover:text-white hover:bg-white/10 transition-colors"
                  aria-label="닫기"
                >
                  <X className="w-5 h-5" />
                </button>
              </div>

              {specialWinners.length > 0 && (
                <div className="bg-amber-50 border-b border-amber-200 p-4 shrink-0">
                  <div className="flex items-center justify-between gap-3">
                    <div className="flex items-center gap-2">
                      <span className="text-2xl">🎈</span>
                      <div>
                        <div className="text-xs font-black text-amber-900 flex items-center gap-1.5">
                          <Sparkles className="w-3.5 h-3.5 text-amber-600" />
                          <span>특별 지정 경품 당첨자</span>
                        </div>
                        <div className="text-sm font-bold text-slate-900 mt-0.5">
                          {specialWinners.map((w) => `${w.participantName} (${w.prizeName})`).join(', ')}
                        </div>
                      </div>
                    </div>

                    {specialWinners[0] && (
                      <button
                        onClick={() => onReplayBalloon(specialWinners[0])}
                        className="px-3 py-1.5 text-xs font-bold bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-xl shadow-xs transition-all flex items-center gap-1.5 shrink-0 active:scale-95"
                      >
                        <PartyPopper className="w-3.5 h-3.5" />
                        <span>축하 풍선 다시 보기</span>
                      </button>
                    )}
                  </div>
                </div>
              )}

              <div className="p-5 sm:p-6 overflow-y-auto space-y-2.5 flex-1">
                {results.map((item, idx) => (
                  <div
                    key={item.participantId}
                    className={`p-3 rounded-2xl border flex items-center justify-between gap-3 transition-all ${
                      item.isSpecial
                        ? 'bg-amber-50/70 border-amber-300 ring-2 ring-amber-300/60 shadow-xs'
                        : 'bg-slate-50/80 border-slate-200'
                    }`}
                  >
                    <div className="flex items-center gap-3 min-w-0">
                      <div
                        className="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs text-white shrink-0 shadow-xs"
                        style={{ backgroundColor: item.participantColor }}
                      >
                        {idx + 1}
                      </div>
                      <div className="min-w-0">
                        <div className="text-sm font-bold text-slate-900 truncate">
                          {item.participantName}
                        </div>
                        <div className="text-xs text-slate-500 font-medium">
                          참여자 #{idx + 1}
                        </div>
                      </div>
                    </div>

                    <div className="text-right flex items-center gap-2">
                      <div className="text-right">
                        <div
                          className={`text-sm font-extrabold truncate max-w-[180px] sm:max-w-xs ${
                            item.isSpecial ? 'text-amber-950 font-black' : 'text-slate-900'
                          }`}
                        >
                          {item.prizeName}
                        </div>
                        {item.isSpecial && (
                          <span className="inline-flex items-center gap-1 text-[11px] font-bold text-amber-700">
                            <span>🎈 특별 지정 경품</span>
                          </span>
                        )}
                      </div>

                      {item.isSpecial && (
                        <button
                          onClick={() => onReplayBalloon(item)}
                          title="풍선 연출 다시 보기"
                          className="p-1.5 text-xs text-amber-800 bg-amber-200 hover:bg-amber-300 rounded-lg transition-colors ml-1"
                        >
                          🎈
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>

              <div className="p-4 sm:p-5 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 shrink-0">
                <div className="flex items-center flex-wrap gap-2">
                  <button
                    onClick={handleSaveImage}
                    disabled={isExporting}
                    className="px-4 py-2 text-xs sm:text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 rounded-xl transition-all shadow-xs flex items-center gap-2 active:scale-95"
                  >
                    {exportSuccess ? (
                      <>
                        <Check className="w-4 h-4 text-emerald-300" />
                        <span>JPG 저장 완료!</span>
                      </>
                    ) : isExporting ? (
                      <>
                        <span className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin" />
                        <span>이미지 생성 중...</span>
                      </>
                    ) : (
                      <>
                        <Download className="w-4 h-4 text-white" />
                        <span>결과 이미지(JPG) 저장</span>
                      </>
                    )}
                  </button>

                  <button
                    onClick={handleCopy}
                    className="px-3.5 py-2 text-xs sm:text-sm font-bold text-slate-800 bg-white border border-slate-300 hover:bg-slate-100 rounded-xl transition-all shadow-xs flex items-center gap-2 active:scale-95"
                  >
                    {copied ? (
                      <>
                        <Check className="w-4 h-4 text-emerald-600" />
                        <span className="text-emerald-700 font-bold">복사 완료!</span>
                      </>
                    ) : (
                      <>
                        <Copy className="w-4 h-4 text-slate-600" />
                        <span>텍스트 복사</span>
                      </>
                    )}
                  </button>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={onGoToSetup}
                    className="px-3.5 py-2 text-xs sm:text-sm font-semibold text-slate-700 hover:text-slate-900 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl transition-all flex items-center gap-1.5"
                  >
                    <Settings className="w-3.5 h-3.5" />
                    <span>설정 수정</span>
                  </button>

                  <button
                    onClick={onPlayAgain}
                    className="px-4 py-2 text-xs sm:text-sm font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-xl transition-all shadow-sm flex items-center gap-1.5 active:scale-95"
                  >
                    <RotateCcw className="w-3.5 h-3.5" />
                    <span>사다리 다시 타기</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      };

      // =========================================================================
      // App.tsx
      // =========================================================================
      const INITIAL_PRIZES = [
        { id: 'prize-1', name: '1등: 백화점 상품권 10만원', isSpecial: true },
        { id: 'prize-2', name: '2등: 한우 선물세트', isSpecial: false },
        { id: 'prize-3', name: '3등: 치킨 기프티콘', isSpecial: false },
        { id: 'prize-4', name: '배달의민족 2만원권', isSpecial: false },
        { id: 'prize-5', name: '스타벅스 디저트 세트', isSpecial: false },
        { id: 'prize-6', name: '올리브영 1만원권', isSpecial: false },
        { id: 'prize-7', name: '영화 2인 관람권', isSpecial: false },
        { id: 'prize-8', name: '편의점 5천원권', isSpecial: false },
        { id: 'prize-9', name: '비타500 한 상자', isSpecial: false },
        { id: 'prize-10', name: '다음 기회에 (참가상)', isSpecial: false },
      ];

      function App() {
        const [participants, setParticipants] = useState(() =>
          DEFAULT_NAMES.slice(0, 10).map((name, i) => {
            const pal = getPaletteForIndex(i);
            return {
              id: `p-${i + 1}`,
              name,
              color: pal.color,
              bgLight: pal.bgLight,
              border: pal.border,
              textColor: pal.text,
              avatarChar: name.charAt(0),
            };
          })
        );

        const [prizes, setPrizes] = useState(INITIAL_PRIZES);
        const [screen, setScreen] = useState('SETUP');
        const [isMuted, setIsMuted] = useState(false);
        const [ladderSeed, setLadderSeed] = useState(1);
        const [specialWinnerForBalloon, setSpecialWinnerForBalloon] = useState(null);

        const rungs = useMemo(() => {
          void ladderSeed;
          return generateLadderRungs(participants.length, 'normal');
        }, [participants.length, ladderSeed]);

        const results = useMemo(() => {
          return computeAllResults(participants, prizes, rungs);
        }, [participants, prizes, rungs]);

        const handleReshuffleRungs = useCallback(() => {
          setLadderSeed((s) => s + 1);
        }, []);

        const handleToggleSound = () => {
          const muted = soundManager.toggleMute();
          setIsMuted(muted);
        };

        const hasSpecialPrize = prizes.some((p) => p.isSpecial);

        return (
          <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-slate-900 selection:bg-amber-200">
            <TopBar
              currentScreen={screen}
              onNavigate={(newScreen) => setScreen(newScreen)}
              isMuted={isMuted}
              onToggleSound={handleToggleSound}
              onResetOrShuffle={handleReshuffleRungs}
              hasSpecialPrize={hasSpecialPrize}
            />

            <main className="flex-1 pb-16">
              {screen === 'SETUP' && (
                <SetupView
                  participants={participants}
                  prizes={prizes}
                  onUpdateParticipants={setParticipants}
                  onUpdatePrizes={setPrizes}
                  onStartGame={() => setScreen('LADDER')}
                />
              )}

              {screen === 'LADDER' && (
                <LadderBoard
                  participants={participants}
                  prizes={prizes}
                  rungs={rungs}
                  results={results}
                  onReshuffleRungs={handleReshuffleRungs}
                  onRevealSpecialWinner={(winner) => setSpecialWinnerForBalloon(winner)}
                  onViewSummary={() => setScreen('SUMMARY')}
                />
              )}

              {screen === 'SUMMARY' && (
                <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
                  <SummaryModal
                    results={results}
                    onClose={() => setScreen('LADDER')}
                    onPlayAgain={() => {
                      handleReshuffleRungs();
                      setScreen('LADDER');
                    }}
                    onGoToSetup={() => setScreen('SETUP')}
                    onReplayBalloon={(result) => setSpecialWinnerForBalloon(result)}
                  />
                </div>
              )}
            </main>

            <BalloonWinnerModal
              winner={specialWinnerForBalloon}
              onClose={() => setSpecialWinnerForBalloon(null)}
              onViewSummary={() => {
                setSpecialWinnerForBalloon(null);
                setScreen('SUMMARY');
              }}
            />
          </div>
        );
      }

      const container = document.getElementById('root');
      if (container) {
        ReactDOM.createRoot(container).render(<App />);
      }
    </script>
  </body>
</html>
